<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/swindle-logo-32.png" />
    <link rel="apple-touch-icon" href="/brand/swindle-logo-200.png" />
    <title>Swindle</title>
    <script>
      // Canonical host: cookies are host-scoped, and localhost vs 127.0.0.1 are
      // different cookie hosts. Force one origin so auth sessions and the
      // Lichess OAuth round trip always stay consistent.
      (function () {
        if (window.location.hostname === "127.0.0.1") {
          window.location.replace(
            "http://localhost:" +
              (window.location.port || "5173") +
              window.location.pathname +
              window.location.search
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
